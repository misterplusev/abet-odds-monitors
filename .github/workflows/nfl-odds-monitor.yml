name: NFL Odds Monitor

# CADENCE: hourly. Operator decision 2026-08-25.
#
# TheOddsAPI bills each call as
#     cost = [unique markets] x [regions] = h2h,spreads,totals (3) x us (1) = 3
# and this pool is SHARED with the MLB suite.
#
#   cadence   MLB/day  NFL/day  total/day  per 31d  % of 4,500 (9 keys)
#   hourly         72       72        144     4,464     99%   <- the target
#   hourly         72      144        216     6,696    149%   (preseason empty)
#
# 4,464 of 4,500 fits ONLY with all nine keys live. API_7 is currently DEAD, so
# the live pool is 8 x 500 = 4,000 and hourly runs at 112% of it.
#
# THIS IS SAFE TO RUN ANYWAY, because quota_gate.py is a hard gate, not advice:
# it reads true per-key balances for free, reserves MLB's projected burn, and
# EXIT 7 (skip) once the pool no longer projects to last until reset. So the
# failure mode of running hourly on 8 keys is DEGRADED NFL CADENCE, never a
# depleted pool or a 401 storm. Restoring API_7 removes the degradation.
#
# PENDING TASK: bring ODDS_API_KEY_7 back online. Until then expect the gate to
# start skipping NFL cycles as the pool tightens toward the day-7 reset.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Quota gate (sustain governor)
        id: gate
        continue-on-error: true
        run: python quota_gate.py
        env:
          ODDS_API_KEY_1: ${{ secrets.ODDS_API_KEY_1 }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          ODDS_API_KEY_5: ${{ secrets.ODDS_API_KEY_5 }}
          ODDS_API_KEY_6: ${{ secrets.ODDS_API_KEY_6 }}
          ODDS_API_KEY_7: ${{ secrets.ODDS_API_KEY_7 }}
          ODDS_API_KEY_8: ${{ secrets.ODDS_API_KEY_8 }}
          ODDS_API_KEY_9: ${{ secrets.ODDS_API_KEY_9 }}
          ODDS_API_KEY_10: ${{ secrets.ODDS_API_KEY_10 }}
          QUOTA_RESET_DAY: ${{ vars.QUOTA_RESET_DAY || '7' }}
          SAFETY_MARGIN: ${{ vars.SAFETY_MARGIN || '0.10' }}
          # MLB stays hourly: 24 cycles x 3 credits = 72/day. The gate reserves
          # this before deciding whether NFL can afford the current cycle.
          MLB_CREDITS_PER_DAY: ${{ vars.MLB_CREDITS_PER_DAY || '72' }}
          POLL_COST: ${{ vars.POLL_COST || '3' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Run odds monitor (single iteration)
        if: steps.gate.outcome == 'success'
        run: python nfl_unified_odds_monitor.py --once
        env:
          ODDS_API_KEY_1: ${{ secrets.ODDS_API_KEY_1 }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          ODDS_API_KEY_5: ${{ secrets.ODDS_API_KEY_5 }}
          ODDS_API_KEY_6: ${{ secrets.ODDS_API_KEY_6 }}
          ODDS_API_KEY_7: ${{ secrets.ODDS_API_KEY_7 }}
          ODDS_API_KEY_8: ${{ secrets.ODDS_API_KEY_8 }}
          ODDS_API_KEY_9: ${{ secrets.ODDS_API_KEY_9 }}
          ODDS_API_KEY_10: ${{ secrets.ODDS_API_KEY_10 }}
          DISCORD_WEBHOOK_NFL_ODDS_MONEYLINES: ${{ secrets.DISCORD_WEBHOOK_NFL_ODDS_MONEYLINES }}
          DISCORD_WEBHOOK_NFL_ODDS_SPREADS: ${{ secrets.DISCORD_WEBHOOK_NFL_ODDS_SPREADS }}
          DISCORD_WEBHOOK_NFL_ODDS_TOTALS: ${{ secrets.DISCORD_WEBHOOK_NFL_ODDS_TOTALS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # ---- DURABLE ODDS HISTORY (new) -------------------------------
          # This runner's disk is destroyed when the job ends. Without these
          # two values durable_state stays disabled, odds_nfl.db starts empty
          # every run, and every chart is drawn from a single point in time -
          # which is exactly the one-datapoint NFL chart bug.
          #
          # HF_TOKEN IS NOT YET A SECRET ON THIS REPO. It must be added, with
          # write access to the dataset, or this change is inert.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ABET_STATE_REPO: ${{ vars.ABET_STATE_REPO || 'abetco/mlb-monitors-state' }}
          ODDS_HISTORY_RETAIN_DAYS: ${{ vars.ODDS_HISTORY_RETAIN_DAYS || '7' }}

      - name: Skipped by quota gate
        if: steps.gate.outcome != 'success'
        run: echo "Quota gate skipped this cycle - pool budget reserved. Job OK."

      # PUBLISH LOGGING (2026-10-14 1345 MDT): every run leaves a downloadable
      # record of exactly what was published - the posted charts, the per-post
      # receipts (post_receipts.jsonl), the per-run manifest (posted_manifest_*.json),
      # every gate verdict (chart_quality_gate.jsonl) and the monitor log.
      # Artifact link appears on the run page: Actions -> run -> Artifacts.
      - name: Upload published charts + logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-odds-published-${{ github.run_number }}_${{ github.run_id }}
          path: |
            data/runtime/nfl/charts/
            data/logs/
          retention-days: 14
          if-no-files-found: warn
